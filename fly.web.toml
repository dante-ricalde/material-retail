# Fly.io config for the Material Retail web (React/Vite).
# See apps/api/fly.toml for the matching api service.

app = "material-retail-dante-web"
primary_region = "iad"

[build]
  dockerfile = "apps/web/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  # The web container proxies /api/* here over Fly's internal network.
  API_TARGET = "http://material-retail-dante-api.internal:4000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
