# fly.toml app configuration file generated for material-retail-dante-api on 2026-08-18T14:29:41-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'material-retail-dante-api'
primary_region = 'iad'

[build]
  dockerfile = 'apps/api/Dockerfile'

[env]
  ALERT_OUTBOX_DIR = '/data/outbox'
  DATABASE_DIR = '/data'
  NODE_ENV = 'production'
  PORT = '4000'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[services]]
  protocol = 'tcp'
  internal_port = 4000

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
